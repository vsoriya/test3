<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }
        .invitation {
            background: rgba(255, 255, 255, 0.95);
            padding: 60px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            transform: scale(0.8);
            animation: popIn 1s ease-in-out forwards;
        }
        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 50px;
            color: #2c3e50;
            animation: slideIn 1s ease-in-out, shake 2s infinite alternate;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 22px;
            color: #34495e;
        }
        .date, .time {
            font-weight: bold;
            color: #e74c3c;
            font-size: 28px;
        }
        .floating-balloons {
            position: absolute;
            width: 60px;
            height: 80px;
            background: red;
            border-radius: 50%;
            animation: floatUp 5s infinite linear;
            opacity: 0.7;
        }
        .glow-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 10%, transparent 70%);
            animation: glow 2s infinite alternate;
        }
        .rsvp-button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            color: white;
            background: #e74c3c;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .rsvp-button:hover {
            background: #c0392b;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatUp {
            from { transform: translateY(100vh); opacity: 1; }
            to { transform: translateY(-10vh); opacity: 0; }
        }
        @keyframes glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-3px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="glow-effect"></div>
    <div class="invitation">
        <h1>You're Invited to</h1>
        <h2>BIRTHDAY PARTY</h2>
        <p>To celebrate <strong>KEO PICH SEREYVATHANAK</strong></p>
        <p class="date">3 May 2025</p>
        <p class="time">5 PM - 11 PM</p>
        <p class="location">E SreyTouch’s House, Prektapov, Deum Mien, Takhmau</p>
        
    </div>
    <audio autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-littleidea.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <script>
        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.classList.add('floating-balloons');
            balloon.style.left = Math.random() * 100 + 'vw';
            balloon.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
            document.body.appendChild(balloon);
            setTimeout(() => balloon.remove(), 5000);
        }
        setInterval(createBalloon, 500);

        function rsvpAlert() {
            alert("Thank you for RSVPing! We can't wait to see you there!");
        }
    </script>
</body>
</html>
